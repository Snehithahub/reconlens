# cp .env.example .env (optional) && docker compose up -d --build
# API: http://localhost:8601/docs   Dashboard: http://localhost:8503
x-app: &app
  build: .
  image: reconlens:local
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["uvicorn", "reconlens.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8601"]
    ports:
      - "8601:8601"
    volumes:
      - reconlens-data:/app/data  # DuckDB file: runs, exceptions, resolutions

  ui:
    <<: *app
    command: ["streamlit", "run", "src/reconlens/ui/app.py", "--server.port", "8503", "--server.address", "0.0.0.0"]
    ports:
      - "8503:8503"
    environment:
      API_URL: http://api:8601
      RECONLENS_UI_MODE: api
      HEALTHCHECK_URL: http://127.0.0.1:8503/_stcore/health
    depends_on:
      api:
        condition: service_healthy

volumes:
  reconlens-data:
