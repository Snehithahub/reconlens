[project]
name = "reconlens"
version = "0.1.0"
description = "AI-assisted payment settlement reconciliation for Indian SMB/D2C merchants: deterministic matching engine, LLM only at the edges"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "altair>=6.3.0,<7",
    "duckdb>=2.0.0,<3",
    "fastapi>=0.162.0,<0.163",
    "httpx>=0.28.1,<0.29",
    "numpy>=2.5.4,<3",
    "openpyxl>=3.1.5,<4",
    "pandas>=3.1.0,<4",
    "pydantic>=2.14.2,<3",
    "pydantic-settings>=2.16.2,<3",
    "python-multipart>=0.0.33,<0.1",
    "pyyaml>=6.0.3,<7",
    "streamlit>=1.66.1,<2",
    "tenacity>=9.2.1,<10",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconlens"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "respx>=0.23.1,<0.24",
    "ruff>=0.17.3,<0.18",
]
